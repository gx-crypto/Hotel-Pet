<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-body">

    <header class="login-header">

        <h1>Hotel Pet</h1>

            <div class="pet.png"></div>


        <p>Sistema de Gerenciamento de Hospedagem para Pets</p>

    </header>

    <main>

        <section class="login-container">

            <h2>Login</h2>

            <form action="dashboard.html">

                <div class="form-grupo">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required>

                </div>

                <div class="form-grupo">

                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required>

                </div>

                <div class="lembrar">

                    <input
                        type="checkbox"
                        id="lembrar"
                        name="lembrar">

                    <label for="lembrar">Lembrar-me</label>

                </div>

                <br>

                <input
                    type="submit"
                    value="Entrar"
                    class="btn-login">

                <input
                    type="reset"
                    value="Limpar"
                    class="btn btn-secundario">

            </form>

            <div class="login-links">

                <p>
                    <a href="#">Esqueci minha senha</a>
                </p>

                <p>
                    
                </p>

            </div>

        </section>

    </main>

    <footer>

        <p><strong>Hotel Pet © 2026</strong></p>

        <p>Rua Principal, 100 - Centro</p>

        <p>Telefone: (77) 99999-9999</p>

        <p>E-mail: contato@hotelpet.com</p>

    </footer>

</body>

</html>
