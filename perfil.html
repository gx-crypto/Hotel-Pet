<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Meu Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>🐾 Hotel Pet</h1>

        <nav>
            <a href="dashboard.html">Dashboard</a> |
            <a href="reservas.html">Reservas</a> |
            <a href="pets.html">Pets</a> |
            <a href="usuarios.html">Usuários</a> |
            <a href="configuracoes.html">Configurações</a> |
            <a href="perfil.html">Meu Perfil</a> |
            <a href="index.html">Sair</a>
        </nav>

    </header>

    <hr>

    <main>

        <h2>Meu Perfil</h2>

        <form>

            <fieldset>

                <legend>Foto do Perfil</legend>

                <img src="imagens/perfil.jpg" alt="Foto do Perfil" width="180">

                <br><br>

                <label for="foto">Alterar Foto:</label><br>
                <input type="file" id="foto">

            </fieldset>

            <br>

            <fieldset>

                <legend>Dados Pessoais</legend>

                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" value="Carlos Lima">

                <br><br>

                <label for="cpf">CPF:</label><br>
                <input type="text" id="cpf" value="123.456.789-00">

                <br><br>

                <label for="telefone">Telefone:</label><br>
                <input type="tel" id="telefone" value="(77) 99999-3333">

                <br><br>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" value="carlos@email.com">

            </fieldset>

            <br>

            <fieldset>

                <legend>Endereço</legend>

                <label for="rua">Rua:</label><br>
                <input type="text" id="rua" value="Rua Principal">

                <br><br>

                <label for="numero">Número:</label><br>
                <input type="number" id="numero" value="150">

                <br><br>

                <label for="bairro">Bairro:</label><br>
                <input type="text" id="bairro" value="Centro">

                <br><br>

                <label for="cidade">Cidade:</label><br>
                <input type="text" id="cidade" value="Macaúbas">

                <br><br>

                <label for="estado">Estado:</label><br>
                <input type="text" id="estado" value="BA">

            </fieldset>

            <br>

            <fieldset>

                <legend>Alterar Senha</legend>

                <label for="senhaAtual">Senha Atual:</label><br>
                <input type="password" id="senhaAtual">

                <br><br>

                <label for="novaSenha">Nova Senha:</label><br>
                <input type="password" id="novaSenha">

                <br><br>

                <label for="confirmarSenha">Confirmar Nova Senha:</label><br>
                <input type="password" id="confirmarSenha">

            </fieldset>

            <br>

            <input type="submit" value="Salvar Alterações">

            <input type="reset" value="Limpar">

        </form>

    </main>

    <hr>

    <footer>

        <p>Hotel Pet © 2026</p>
        <p>Sistema de Gerenciamento de Hospedagem para Pets</p>

    </footer>

</body>

</html>
