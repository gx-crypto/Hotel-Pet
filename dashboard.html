<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="app-body">

    <!-- =========================
         CABEÇALHO
         ========================= -->

    <header class="app-header">

        <div class="logo">
             Hotel Pet
        </div>

    </header>


    <!-- =========================
         CONTEÚDO
         ========================= -->

    <main class="container">

        <div class="titulo">

            <h1>Painel do Gerente</h1>

            <p>Bem-vindo ao sistema Hotel Pet!</p>

        </div>


        <!-- =========================
             BUSCA
             ========================= -->

        <div class="busca">

            <input
                type="text"
                placeholder="Buscar por pet">

            <button type="button">
                🔍
            </button>

        </div>


        <!-- =========================
             BOTÕES PRINCIPAIS
             ========================= -->

        <div class="botoes-topo">

            <a
                href="reservas.html"
                class="botao-menu">

                Reservas

            </a>


            <a
                href="pets.html"
                class="botao-menu">

                Pets

            </a>


            <a
                href="usuarios.html"
                class="botao-menu">

                Usuários

            </a>

        </div>


        <!-- =========================
             CARDS
             ========================= -->

        <div class="cards">

            <div class="card">

                <h3>Reservas</h3>

                <p>0</p>

            </div>


            <div class="card">

                <h3>Pets</h3>

                <p>0</p>

            </div>


            <div class="card">

                <h3>Usuários</h3>

                <p>0</p>

            </div>


            <div class="card">

                <h3>Status</h3>

                <p>Ativo</p>

            </div>

        </div>


        <!-- =========================
             NOVA RESERVA
             ========================= -->

        <div class="tabela-container">

            <h2>Reservas</h2>

            <br>

            <a
                href="novareserva.html"
                class="btn">

                + Nova Reserva

            </a>

        </div>

    </main>


    <!-- =========================
         MENU INFERIOR
         ========================= -->

    <nav class="menu-inferior">

        <a
            href="reservas.html">

            <span class="menu-icone">📅</span>

            <span>Reservas</span>

        </a>


        <a
            href="pets.html">

            <span class="menu-icone">🐾</span>

            <span>Pets</span>

        </a>


        <a
            href="usuarios.html">

            <span class="menu-icone">👥</span>

            <span>Usuários</span>

        </a>


        <a
            href="perfil.html">

            <span class="menu-icone">👤</span>

            <span>Perfil</span>

        </a>


        <a
            href="configuracoes.html">

            <span class="menu-icone">⚙️</span>

            <span>Configurações</span>

        </a>

    </nav>


</body>

</html>
