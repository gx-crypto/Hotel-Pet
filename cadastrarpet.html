<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Cadastrar Pet</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>🐾 Hotel Pet</h1>

        <nav>
            <a href="dashboard.html">Dashboard</a> |
            <a href="reservas.html">Reservas</a> |
            <a href="pets.html">Pets</a> |
            <a href="usuarios.html">Usuários</a> |
            <a href="configuracoes.html">Configurações</a> |
            <a href="perfil.html">Meu Perfil</a> |
            <a href="index.html">Sair</a>
        </nav>

    </header>

    <hr>

    <main>

        <h2>Cadastro de Pet</h2>

        <form>

            <fieldset>

                <legend>Informações do Pet</legend>

                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome">

                <br><br>

                <label for="especie">Espécie:</label><br>
                <select id="especie">
                    <option>Cachorro</option>
                    <option>Gato</option>
                    <option>Pássaro</option>
                    <option>Coelho</option>
                    <option>Outro</option>
                </select>

                <br><br>

                <label for="raca">Raça:</label><br>
                <input type="text" id="raca">

                <br><br>

                <label for="porte">Porte:</label><br>
                <select id="porte">
                    <option>Pequeno</option>
                    <option>Médio</option>
                    <option>Grande</option>
                </select>

                <br><br>

                <label>Sexo:</label><br>

                <input type="radio" name="sexo"> Macho
                <input type="radio" name="sexo"> Fêmea

                <br><br>

                <label for="nascimento">Data de Nascimento:</label><br>
                <input type="date" id="nascimento">

                <br><br>

                <label for="peso">Peso:</label><br>
                <input type="number" id="peso" placeholder="Ex: 12">

                <br><br>

                <label for="cor">Cor:</label><br>
                <input type="text" id="cor">

            </fieldset>

            <br>

            <fieldset>

                <legend>Proprietário</legend>

                <label for="proprietario">Nome do Proprietário:</label><br>
                <input type="text" id="proprietario">

                <br><br>

                <label for="telefone">Telefone:</label><br>
                <input type="tel" id="telefone">

                <br><br>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email">

            </fieldset>

            <br>

            <fieldset>

                <legend>Foto do Pet</legend>

                <input type="file">

            </fieldset>

            <br>

            <fieldset>

                <legend>Observações</legend>

                <textarea rows="6" cols="60"
                    placeholder="Digite informações importantes sobre o pet..."></textarea>

            </fieldset>

            <br>

            <input type="submit" value="Salvar">

            <input type="reset" value="Limpar">

            <a href="pets.html">
                <button type="button">Cancelar</button>
            </a>

        </form>

    </main>

    <hr>

    <footer>

        <p>Hotel Pet © 2026</p>

        <p>Sistema de Gerenciamento de Hospedagem para Pets</p>

    </footer>

</body>

</html>
