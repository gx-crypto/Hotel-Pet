<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hotel Pet - Nova Reserva</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body class="app-body"><header class="app-header"><div class="logo">🐾 Hotel Pet</div><p>Área do Gerente</p></header><main class="container"><h1>Nova Reserva</h1><p>Preencha os dados para registrar uma hospedagem.</p><form id="formReserva" class="tabela-container"><div class="form-grid"><div class="campo"><label for="tutor">Tutor</label><input id="tutor" required></div><div class="campo"><label for="pet">Nome do Pet</label><input id="pet" required></div><div class="campo"><label for="entrada">Data de entrada</label><input type="date" id="entrada" required></div><div class="campo"><label for="saida">Data de saída</label><input type="date" id="saida" required></div><div class="campo"><label for="status">Status</label><select id="status"><option>Reservada</option><option>Em andamento</option><option>Finalizada</option></select></div></div><label for="observacoes">Informações sobre o pet</label><textarea id="observacoes" placeholder="Alimentação, cuidados e observações"></textarea><p>Valor da diária: <strong id="valorDiaria">R$ 80,00</strong></p><p>Total estimado: <strong id="totalReserva">R$ 0,00</strong></p><button type="submit">Salvar Reserva</button> <a class="btn btn-secundario" href="reservas.html">Cancelar</a></form></main><nav class="menu-inferior">
